<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortt Pro — Sistema de Assistência Técnica</title>
  <link rel="stylesheet" href="tecnico.css" />
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

<div class="wrap">

  <header class="top">
    <div>
     <div class="brand">
  <img src="./favicon.png" alt="AssistPro" class="logo-img">
  <span class="brand-name">Fortt <strong>Pro</strong></span>
</div>
      <p>Crie OS, atualize status e notifique o cliente por email.</p>
    </div>
    <div class="actions">
      <span class="pill" id="techEmail">—</span>
      <button id="logoutBtn" type="button">Sair</button>
    </div>
  </header>

  <!-- Barra de busca + filtros -->
  <section class="toolbar">
    <input id="searchInput" placeholder="Buscar por OS, equipamento, modelo, UID..." />
    <select id="statusFilter">
      <option value="">Todos os status</option>
      <option>Recebido</option>
      <option>Em análise</option>
      <option>Aguardando aprovação</option>
      <option>Aguardando peça</option>
      <option>Em manutenção</option>
      <option>Em teste</option>
      <option>Finalizado</option>
      <option>Pronto para retirada</option>
      <option>Entregue</option>
    </select>
    <div class="counter" id="counter">0 OS</div>
  </section>

  <section class="grid">

    <!-- Form -->
    <div class="card">
      <h2>Criar / Atualizar OS</h2>

      <div class="selected" id="selectedBox" style="display:none;">
        <div>
          <div class="selected-title" id="selectedTitle">—</div>
          <div class="selected-sub" id="selectedSub">—</div>
        </div>
        <span class="badge" id="selectedStatus">—</span>
      </div>

      <label>Email do Cliente</label>
      <div class="row">
        <input id="clienteEmail" placeholder="cliente@email.com" />
        <button id="buscarClienteBtn" type="button" class="secondary small">Buscar</button>
      </div>
      <p class="mini" id="clienteEncontrado" style="display:none;"></p>

      <label>UID do Cliente</label>
      <input id="ownerUid" placeholder="UID do cliente (auto ao buscar por email)" />

      <label>Tipo do Equipamento</label>
      <input id="equipamentoTipo" placeholder="Notebook / PC / MacBook..." />

      <label>Modelo</label>
      <input id="equipamentoModelo" placeholder="Ex: Dell Inspiron 15" />

      <label>Problema</label>
      <input id="problema" placeholder="Ex: Não liga / tela preta..." />

      <label>Status (ao criar)</label>
      <select id="status">
        <option>Recebido</option>
        <option>Em análise</option>
        <option>Aguardando aprovação</option>
        <option>Aguardando peça</option>
        <option>Em manutenção</option>
        <option>Em teste</option>
        <option>Finalizado</option>
        <option>Pronto para retirada</option>
        <option>Entregue</option>
      </select>

      <button id="createBtn" type="button">Criar OS</button>

      <div class="divider"></div>

      <label>OS selecionada (docId)</label>
      <input id="osDocId" placeholder="Clique numa OS na lista ao lado" />

      <label>Novo Status</label>
      <select id="statusUpdate">
        <option>Recebido</option>
        <option>Em análise</option>
        <option>Aguardando aprovação</option>
        <option>Aguardando peça</option>
        <option>Em manutenção</option>
        <option>Em teste</option>
        <option>Finalizado</option>
        <option>Pronto para retirada</option>
        <option>Entregue</option>
      </select>

      <label>Observação (vai no histórico e no email)</label>
      <input id="statusNote" placeholder="Ex: peça chegou / cliente aprovou orçamento..." />

      <button id="updateBtn" type="button" class="secondary">Atualizar Status + Enviar Email</button>

      <p class="mini">Dica: clique numa OS na lista → o formulário preenche sozinho ✅</p>
    </div>

    <!-- Lista -->
    <div class="card">
      <div class="list-head">
        <h2>Ordens (tempo real)</h2>
        <span class="mini" id="lastUpdate">—</span>
      </div>

      <div id="allOs" class="list"></div>
    </div>

  </section>

</div>

<!-- EmailJS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script type="module" src="tecnico.js"></script>


</body>
</html>
