<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Fortt Pro — Sistema de Assistência Técnica</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <div class="container">
    <div class="login-card">

      <h2 id="formTitle">Bem-vindo</h2>
      <p class="subtitle" id="formSubtitle">Acesse sua conta</p>

      <div class="input-group" id="nameField">
        <input type="text" id="nome" placeholder=" " />
        <label>Nome</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" required placeholder=" " />
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="senha" required placeholder=" " />
        <label>Senha</label>
      </div>

      <button id="actionBtn">Entrar</button>

      <p class="toggle-text">
        <span id="toggleMessage">Não tem conta?</span>
        <a href="#" id="toggleLink">Criar conta</a>
      </p>

      <p class="mini">
        Dica: técnico entra em <strong>tecnico.html</strong> (conta com role “tecnico”).
      </p>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
